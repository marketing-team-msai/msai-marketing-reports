name: MSAI Marketing Sync

on:
  schedule:
    # 11:00 UTC = 6:00 AM US Central (CDT). In winter (CST) this lands at 5:00 AM.
    # Change to '0 12 * * *' if you want 6:00 AM year-round in winter.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run one report only: influence, netnew or sla. Blank = all three.'
        required: false
        default: ''
      dry_run:
        description: 'Compute from HubSpot but write nothing to Supabase'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: msai-reports
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Chicago

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The generators read config.env, so we write it from GitHub Secrets at
      # run time. It never touches the repo.
      - name: Write config.env from secrets
        run: |
          cat > config.env <<EOF
          HUBSPOT_TOKEN=${{ secrets.HUBSPOT_TOKEN }}
          HUBSPOT_PORTAL_ID=20335613
          CAMPAIGN_INFLUENCE_FOLDER_ID=240016304
          NET_NEW_PIPELINE_ID=813739955
          DEALS_CREATED_SINCE=2025-06-01
          SLA_DAYS_IN_PROGRESS=14
          SLA_DAYS_QUALIFIED=14
          SLA_DAYS_AWAITING_SALES_QUALIFICATION=1
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          MKTG_SCHEMA=mktg
          EOF

      # Fails fast and cheaply if the mktg schema has drifted from what the row
      # builders write, before spending minutes pulling HubSpot.
      - name: Check schema
        run: python sync_to_mktg.py --check-schema

      - name: Sync to mktg
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ];          then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python sync_to_mktg.py $ARGS

      - name: Remove secrets file
        if: always()
        run: rm -f config.env
